name: DotArena CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pytest pybind11
        pip install numpy
        
    - name: Build C++ Extension
      run: make
        
    - name: Run Tests
      run: make test
      
    - name: Upload GIF Artifact
      uses: actions/upload-artifact@v4
      with:
        name: test-simulation-gif
        path: test_simulation.gif
        if-no-files-found: ignore
